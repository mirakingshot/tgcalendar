<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truegold Calendar Planner (Nov 23 unlock)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap">
<style>
:root{color-scheme:light;--bg:#F7F3EF;--tx:#111;--mu:#6a655e;--ac:#FFE59A}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--tx);font:16px/1.55 "Nunito",system-ui,sans-serif}
main{width:min(100%,720px);text-align:center}
h1{margin:0 0 24px;font-size:clamp(1.7rem,5vw,2.4rem);font-weight:800;letter-spacing:-.01em}
h1 span{color:var(--mu);font-size:.58em;font-weight:600;white-space:nowrap}
p{margin:0 0 28px;font-size:1.15rem}
.button{display:inline-block;padding:16px 48px;border-radius:16px;background:var(--ac);color:var(--tx);font-size:1.5rem;font-weight:800;text-decoration:none}
.button:hover{transform:translateY(-2px)}
.button:focus-visible{outline:3px solid var(--tx);outline-offset:4px}
</style>
</head>
<body>
<main>
<h1>TG6-8 Calendar Planner</h1>
<p>sike, I combined this with 1559+!</p>
<a class="button" href="https://mirakingshot.github.io/tgcalendar/">go there</a>
</main>
</body>
</html>
